[project]
name = "pulse"
authors = [
  { name = "Christos Karanikolopoulos", email = "chkaranikolopoulos@cs.uoi.gr" },
]
version = "0.1.0"
description = "PULSE - Polling Using LLM-based Sentiment Extraction"
readme = "README.md"
requires-python = ">=3.12"

keywords = ["Large Language Models", "Forecasting", "Virtual Poll"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "datasets>=5.0.1",
  "fsspec>=2026.6.0",
  "huggingface-hub>=1.33.0",
  "jinja2>=3.1.6",
  "lm-eval[api]>=0.4.13",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "pyyaml>=6.0.3",
  "requests>=2.34.2",
  "seaborn>=0.13.2",
  "st-pages>=1.0.1",
  "streamlit>=1.65.0",
  "streamlit-hotkeys>=0.6.0",
  "transformers>=5.18.0",
]

[dependency-groups]
dev = [
  "commitizen>=4.19.1",
  "ipykernel>=7.4.0",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "ruff>=0.16.10",
]

[project.urls]
GitHub = "https://github.com/karanikolopoulos/pulse"

[project.scripts]
pulse = "pulse.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = false

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", ".vscode"]

[tool.ruff.lint]
select = [
  # linting
  "B",    # flake8-bugbear
  "C",    # flake8-comprehensions
  "D200", # unnecessary-multiline-docstring
  "D202", # blank-line-after-function
  "E",    # pycodestyle
  "F",    # Pyflakes
  "PL",   # pylint
  # formatting
  "I",    # isort
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "B905",    # zip-without-explicit-strict
  "E731",    # lambda-assignment
  "PLR0913", # too-many-arguments
  "PLR0917", # too-many-positional-arguments
  "W191",    # indentation-with-tabs, handled by ruff-format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # magic-value-comparison

[tool.ruff.lint.isort]
from-first = false
force-single-line = false
length-sort = true
lines-between-types = 1
known-first-party = ["pulse"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
